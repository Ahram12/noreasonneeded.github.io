<!DOCTYPE html>
<html>
<head>
    <title>No Reason Needed</title>
</head>
<body>

    <h1>My Math Blog</h1>

    <p>Welcome! This is where I write about mathematics.</p>

    <h2>Recent Posts</h2>

    <ul>
        {% for post in site.posts %}
        <li>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <small>{{ post.date | date: "%B %d, %Y" }}</small>
        </li>
        {% endfor %}
    </ul>

</body>
</html>
