---
layout: default
---

<section class="hero">

    <p class="hero__eyebrow">{{ site.description }}</p>

    <h1>My Math Blog</h1>

    <p class="hero__lede">
        Welcome! This is where I write about mathematics, ideas, problems,
        and whatever else catches my attention.
    </p>

</section>

<section>

    <div class="section-head">
        <h2>Recent</h2>
        <a href="{{ '/posts.html' | relative_url }}">All posts &rarr;</a>
    </div>

    <ul class="post-list">
        {% for post in site.posts limit: 3 %}
            {% include post-card.html post=post %}
        {% endfor %}
    </ul>

</section>
