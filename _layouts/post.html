<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} - No Reason Needed</title>

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

    <!-- MathJax -->
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
    };
    </script>

    <script async
        src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
    </script>
</head>

<body>

    <header>
        <h1>
            <a href="{{ '/' | relative_url }}">No Reason Needed</a>
        </h1>
    </header>

    <main>
        <h1>{{ page.title }}</h1>

        <p>
            <em>{{ page.date | date: "%B %d, %Y" }}</em>
        </p>

        {{ content }}
    </main>

</body>
</html>
