<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

    <meta name="description" content="{{ page.description | default: site.description }}">

    {% comment %}
      Applies the reader's saved theme before first paint so the
      page never flashes the wrong background.
    {% endcomment %}
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/rouge.css' | relative_url }}">

    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230f6a6e'/></svg>">

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body class="layout-{{ page.layout | default: 'page' }}">

<div class="progress" aria-hidden="true"><span data-progress-bar></span></div>

<a class="skip-link" href="#content">Skip to content</a>

<header class="site-header" data-site-header>
    <div class="site-header__inner">

        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <nav class="site-nav" aria-label="Primary">

            <a href="{{ '/' | relative_url }}"
               {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>

            <a href="{{ '/posts.html' | relative_url }}"
               {% if page.url == '/posts.html' or page.layout == 'post' %}aria-current="page"{% endif %}>Posts</a>

            <a href="{{ '/about.html' | relative_url }}"
               {% if page.url == '/about.html' %}aria-current="page"{% endif %}>About</a>

            <button class="theme-toggle" type="button" data-theme-toggle
                    aria-label="Switch between light and dark theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"></circle>
                    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path>
                </svg>
            </button>

        </nav>

    </div>
</header>

<main id="content">

    {{ content }}

</main>

<footer class="site-footer">
    <div class="site-footer__inner">

        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>

        <p>
            <a href="{{ '/posts.html' | relative_url }}">Posts</a>
            &nbsp;&middot;&nbsp;
            <a href="{{ '/about.html' | relative_url }}">About</a>
        </p>

    </div>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>

</body>
</html>
